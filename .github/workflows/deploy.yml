name: CI
on:
  push:
    branches:
      - timofey
  pull_request: 
    branches:
      - main

jobs:
  linter: 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      - name: Install Dependecies
        run: yarn install
      - name: Linter Test
        run: yarn lint


